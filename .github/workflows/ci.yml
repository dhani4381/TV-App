name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 409600 || { echo "APK is over 400 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }
      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-release-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk

  launcher-makeover:
    name: Makeover Launcher (with Phone Remote)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Makeover Launcher
        working-directory: launcher-makeover
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload Makeover Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: atvhome-makeover-apk
          path: launcher-makeover/app/build/outputs/apk/debug/app-debug.apk

  live-tv:
    name: Live TV Indian Channels APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Live TV APK (armeabi-v7a for Android TV)
        working-directory: apps/live-tv
        run: |
          flutter build apk --release --target-platform android-arm --android-skip-build-dependency-validation
      - name: Upload Live TV APK
        uses: actions/upload-artifact@v4
        with:
          name: livetv-release-apk
          path: apps/live-tv/build/app/outputs/flutter-apk/app-release.apk
